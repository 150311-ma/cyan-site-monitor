name: 每分钟巡检

# 为什么不是 cron "*/1 * * * *"：
#   GitHub Actions 的 schedule 最短粒度就是 5 分钟，写 */1 也会被节流成 5~15 分钟，
#   而且高峰期经常直接丢掉。所以这里用「每 5 分钟唤起一次，一次连跑 5 轮、
#   每轮间隔 60 秒」的办法，把覆盖率补成真正的一分钟一次。
#   代价是每个 job 占约 5 分钟额度；公开仓库的 Actions 分钟数不计量，所以免费。

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: uptime-1min
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 巡检（5 轮 × 每 60 秒）
        id: probe
        continue-on-error: true
        run: node monitor.mjs --tier core --rounds 5 --interval 60

      - name: 处理告警（开/关 Issue）
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERTS_JSON: ${{ steps.probe.outputs.alertsJson }}
          RECOVERIES_JSON: ${{ steps.probe.outputs.recoveriesJson }}
        run: node alert.mjs

      - name: 有状态翻转时留痕
        if: always() && steps.probe.outputs.stateChanged == '1'
        run: |
          git config user.name "uptime-bot"
          git config user.email "uptime-bot@users.noreply.github.com"
          git add -A state history reports || true
          git diff --cached --quiet || git commit -m "chore(state): $(date -u +%FT%TZ) 状态更新"
          git push || true
