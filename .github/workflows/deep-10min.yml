name: 深度巡检

# 10 分钟一次，跑那些「会产生副作用」的检查：
#   · POST /api/auth/login 错误凭据（会计一次失败登录，所以不能每分钟打）
#   · POST /api/license/verify 伪签名（验证 Ed25519 验签链路真的在跑）
#   · 后台子页面、RSS、文档页等次要端点

on:
  schedule:
    - cron: "4-59/10 * * * *"
  workflow_dispatch:

concurrency:
  group: uptime-deep
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 深度巡检
        id: probe
        continue-on-error: true
        run: node monitor.mjs --tier deep --rounds 1

      - name: 处理告警（开/关 Issue）
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERTS_JSON: ${{ steps.probe.outputs.alertsJson }}
          RECOVERIES_JSON: ${{ steps.probe.outputs.recoveriesJson }}
        run: node alert.mjs

      - name: 有状态翻转时留痕
        if: always() && steps.probe.outputs.stateChanged == '1'
        run: |
          git config user.name "uptime-bot"
          git config user.email "uptime-bot@users.noreply.github.com"
          git add -A state history reports || true
          git diff --cached --quiet || git commit -m "chore(state-deep): $(date -u +%FT%TZ) 状态更新"
          git push || true
